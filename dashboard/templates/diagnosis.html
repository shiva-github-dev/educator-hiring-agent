<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>Diagnosis — Educator Hiring Agent</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 1100px; }
  a { color: #1e6fd9; } table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  th, td { border: 1px solid #ddd; padding: .3rem; text-align: left; vertical-align: top; }
  pre { white-space: pre-wrap; margin: 0; }
  .queued { color: #7a5b00; } .done { color: #0a7d32; } .failed { color: #b00020; } .manual { color: #555; }
</style>
</head>
<body>
<h1>Agent 6 — Diagnosis</h1>
<p><a href="/">Dashboard</a> · <a href="/logs">Log</a> · <a href="/healthz">Healthz</a></p>
<table>
  <tr><th>event</th><th>status</th><th>error</th><th>report</th><th>updated</th></tr>
  {% for r in rows %}
  <tr>
    <td><a href="/logs?event={{ r.event_id }}">{{ r.event_id }}</a></td>
    <td class="{{ r.status }}">{{ r.status }}</td>
    <td>{{ r.error_type }}<br>{{ r.error_message }}</td>
    <td><pre>{{ r.report }}</pre></td>
    <td>{{ r.updated_at }}</td>
  </tr>
  {% endfor %}
</table>
</body>
</html>
